services:
  qdrant:
    image: qdrant/qdrant:v1.14.1
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
      - snap-exchange:/exchange
    # celowo BEZ ports: dostęp tylko z sieci wewnętrznej stacka
  mcp:
    build: .
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_MCP_8000
      - MCP_TOKEN=${MCP_TOKEN}
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - snap-exchange:/exchange
    depends_on:
      - qdrant
volumes:
  qdrant-data:
  snap-exchange:
